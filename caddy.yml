services:
  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: unless-stopped
    # Host networking is required to reach Home Assistant, which itself uses
    # network_mode: host (see home-assistant.yml) and therefore has no
    # container-network address Caddy could otherwise reverse_proxy to.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
