services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    ports:
      - "1411:1411"
    volumes:
      - pocket-id-data:/app/data
    environment:
      APP_URL: "https://hal9000.lan:8443"
      TRUST_PROXY: "true"
      ENCRYPTION_KEY_FILE: /run/secrets/pocket_id_encryption_key
      STATIC_API_KEY_FILE: /run/secrets/pocket_id_static_api_key
    secrets:
      - pocket_id_encryption_key
      - pocket_id_static_api_key
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  pocket-id-data:

secrets:
  pocket_id_encryption_key:
    file: ./secrets/pocket_id_encryption_key.txt
  pocket_id_static_api_key:
    file: ./secrets/pocket_id_static_api_key.txt
