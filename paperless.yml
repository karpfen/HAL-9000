services:
  paperless-postgres-db:
    image: docker.io/library/postgres:17
    container_name: paperless-postgres-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/paperless_pg_paperless_password
    secrets:
      - paperless_pg_paperless_password

  paperless-redis:
    image: docker.io/library/redis:8
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-postgres-db
      - paperless-redis
      - paperless-gotenberg
      - paperless-tika
    ports:
      - "8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-postgres-db
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_OCR_LANGUAGE=deu+eng
      - PAPERLESS_TIME_ZONE=Europe/Berlin
      - USERMAP_GID=33
      - USERMAP_UID=33
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY must be set in .env}
      # Pocket ID SSO. Does NOT auto-link by claim: a user must first log in
      # with their existing local password, then connect their Pocket ID
      # account under My Profile. ALLOW_SIGNUPS=false blocks OIDC login from
      # ever creating a brand-new account on its own.
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS=false
      # Caddy terminates TLS and forwards plain HTTP to this container, so
      # without this, Paperless would think every request is plain HTTP and
      # build the wrong (http, not https) OIDC callback URL, breaking login.
      - PAPERLESS_PROXY_SSL_HEADER=["HTTP_X_FORWARDED_PROTO", "https"]
      - PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket-ID","client_id":"${PAPERLESS_OIDC_CLIENT_ID:?PAPERLESS_OIDC_CLIENT_ID must be set in .env}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET:?PAPERLESS_OIDC_CLIENT_SECRET must be set in .env}","settings":{"server_url":"https://hal9000.lan:8443"}}]}}
  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.22
    container_name: paperless-gotenberg
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  paperless-tika:
    image: docker.io/apache/tika:latest
    container_name: paperless-tika
    restart: unless-stopped

volumes:
  data:
  media:
  pgdata:
  redisdata:

secrets:
  paperless_pg_paperless_password:
    file: ./secrets/paperless_pg_paperless.txt
